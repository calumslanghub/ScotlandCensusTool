# UV703 + UV703b: distance travelled to work. UV703b (by age) has the same bands, so each
# band's age split (`group: age`) feeds the age breakdown pie.
#
# The average distance is an estimate from bands, not a measurement: each band counts as its
# midpoint (`value`, km); the open-ended top band "60km and over" counts as 75 km (1.25 x its
# lower limit, an assumption); working from home and no fixed place of work have no distance
# and are left out of the average but kept in the shares. "Less than 5 km" needs no assumption.

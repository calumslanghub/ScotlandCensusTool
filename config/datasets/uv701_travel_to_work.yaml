# UV701 + UV701b: method of travel to work. UV701 has eleven methods; UV701b (by age) groups
# them into eight, so the shown rows follow UV701b and UV701's finer methods are their sub-types
# (rail -> train / underground, other -> taxi / motorcycle / other). UV701b's age bands are a
# second split (`group: age`) of each of the eight, for the age breakdown pie. Shares are of
# UV701's methods; UV701b's counts are disclosure-controlled separately, so a method's age
# bands add up to its share only approximately.

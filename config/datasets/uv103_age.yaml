# UV103: age by single year. Every single-year column is read (numeric_columns) and used for
# the mean; the dropdown offers age bands summed from them.
id: uv103_age
status: ready
table: UV103
title: Age by single year
scheme: Blues
source:
  file: data/raw/Census/Census2022OutputAreaUV/UV103 - Age by single year.csv
  citation: "Scotland's Census 2022, UV103, Output Areas. Crown copyright, National Records of Scotland, Open Government Licence v3.0"
universe: {label: "All people", total_column: "All people"}
numeric_columns:
  prefix: age
  offset: 0.5            # a person aged n has lived n + 0.5 years on average
  aliases: {"Under 1": 0, "100 and over": 100}
categories:
  - {id: age_0_15,  label: "Aged 0–15",  short: "0–15",  range: [0, 15]}
  - {id: age_16_24, label: "Aged 16–24", short: "16–24", range: [16, 24]}
  - {id: age_25_44, label: "Aged 25–44", short: "25–44", range: [25, 44]}
  - {id: age_45_64, label: "Aged 45–64", short: "45–64", range: [45, 64]}
  - {id: age_65_74, label: "Aged 65–74", short: "65–74", range: [65, 74]}
  - {id: age_75p,   label: "Aged 75 and over", short: "75+", range: [75, 100]}
means:
  - {id: mean_age, label: Average age, unit: years, decimals: 1}
note: "Average age is the mean of single years of age plus half a year; the oldest group (100 and over) counts as 100.5."

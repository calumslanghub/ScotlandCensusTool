# UV112: household composition, counted in people. Nested "Total" columns are subtotals; the
# shown rows are one person, one family all aged 66+, the three couple / lone parent family types and
# other households, each broken down by its children. "One family household: Total" is not read.
id: uv112_household_composition_people
status: ready
table: UV112
title: Household composition (people)
scheme: BuGn
source:
  file: "data/raw/Census/Census2022OutputAreaUV/UV112 - Household composition - People.csv"
  citation: "Scotland's Census 2022, UV112, Output Areas. Crown copyright, National Records of Scotland, Open Government Licence v3.0"
universe: {label: "All people in households", total_column: "All people in households"}
categories:
  - {id: one_person, column: "One person household: Total", subtotal: true, label: One person household, short: One person}
  - {id: one_66p, column: "One person household: Aged 66 and over", parent: one_person, label: "One person household, aged 66 and over", short: 66 and over}

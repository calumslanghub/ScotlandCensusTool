# UV205b (by sex and age) splits each category for the breakdown pies; it is disclosure-controlled
# separately, so a category's bands add up to its share only approximately.
# UV205b (by sex by age) labels its oldest band "65 - 115".
splits:
  - group: age
    prefix: UV205b
    column: "{header} - {band}"
    bands:
      - {id: a0_15, header: "0 - 15", label: "aged 0 to 15", short: "0 to 15"}
      - {id: a16_24, header: "16 - 24", label: "aged 16 to 24", short: "16 to 24"}

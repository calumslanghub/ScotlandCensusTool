# UV608: NS-SeC of the Household Reference Person (HRP).
#
# NOT USABLE YET. The file in data/raw/Census/Census2022OutputAreaUV is a truncated download:
# it has one column ("L12: Semi-routine occupations") and one output area. Download the full
# Output Areas table again from Scotland's Census, then:
#   python -m build.table_headers "data/raw/Census/Census2022OutputAreaUV/UV608 - National Statistics Socio-economic Classification (NS-SeC) of Household Reference Person (HRP).csv"
# The columns should match UV607 (L1 ... L15), which `categories` below assumes: check them,
# set universe.total_column from the file's total column, then set status: ready. Its
# indicator (ns_sec_hrp) is already in config/explorer.yaml and stays hidden until then.
id: uv608_ns_sec_hrp
status: draft
table: UV608
title: Socio-economic classification (NS-SeC) of the Household Reference Person
scheme: BuPu
source:
  file: "data/raw/Census/Census2022OutputAreaUV/UV608 - National Statistics Socio-economic Classification (NS-SeC) of Household Reference Person (HRP).csv"
  citation: "Scotland's Census 2022, UV608, Output Areas. Crown copyright, National Records of Scotland, Open Government Licence v3.0"
universe: {label: "Household Reference Persons aged 16 and over", total_column: TODO, unit: households}
# Copied from uv607_ns_sec.yaml on the assumption that UV608 has the same L1 ... L15 columns:
# check them against the complete file before setting status: ready.
categories:
  - {id: l1, column: "L1: Employers in large establishments", parent: higher, label: "L1: Employers in large establishments", short: L1 Large employers}
  - {id: l2, column: "L2: Higher managerial and administrative occupations", parent: higher, label: "L2: Higher managerial and administrative occupations", short: L2 Higher managerial}
  - {id: l3, column: "L3: Higher professional occupations", parent: higher, label: "L3: Higher professional occupations", short: L3 Higher professional}
  - {id: l4, column: "L4: Lower professional and higher technical occupations", parent: lower_managerial, label: "L4: Lower professional and higher technical occupations", short: L4 Lower professional}
  - {id: l5, column: "L5: Lower managerial and administrative occupations", parent: lower_managerial, label: "L5: Lower managerial and administrative occupations", short: L5 Lower managerial}
  - {id: l6, column: "L6: Higher supervisory occupations", parent: lower_managerial, label: "L6: Higher supervisory occupations", short: L6 Higher supervisory}
  - {id: intermediate, column: "L7: Intermediate occupations", label: "3. Intermediate occupations", short: Intermediate}
  - {id: l8, column: "L8: Employers in small establishments", parent: small_employers, label: "L8: Employers in small establishments", short: L8 Small employers}
  - {id: l9, column: "L9: Own account workers", parent: small_employers, label: "L9: Own account workers", short: L9 Own account}
  - {id: l10, column: "L10: Lower supervisory occupations", parent: lower_supervisory, label: "L10: Lower supervisory occupations", short: L10 Lower supervisory}
  - {id: l11, column: "L11: Lower technical occupations", parent: lower_supervisory, label: "L11: Lower technical occupations", short: L11 Lower technical}
  - {id: semi_routine, column: "L12: Semi-routine occupations", label: "6. Semi-routine occupations", short: Semi-routine}
  - {id: routine, column: "L13: Routine occupations", label: "7. Routine occupations", short: Routine}
  - {id: l14_1, column: "L14.1: Never worked", parent: never_worked, label: "L14.1: Never worked", short: Never worked}
  - {id: l14_2, column: "L14.2: Long-term unemployed", parent: never_worked, label: "L14.2: Long-term unemployed", short: Long-term unemployed}
  - {id: students, column: "L15: Full-time students", label: Full-time students, short: Students}
  # --- analytic classes ---
  - {id: higher, of: [l1, l2, l3], label: "1. Higher managerial, administrative and professional occupations", short: Higher managerial}
  - {id: lower_managerial, of: [l4, l5, l6], label: "2. Lower managerial, administrative and professional occupations", short: Lower managerial}
  - {id: small_employers, of: [l8, l9], label: "4. Small employers and own account workers", short: Small employers}
  - {id: lower_supervisory, of: [l10, l11], label: "5. Lower supervisory and technical occupations", short: Lower supervisory}
  - {id: never_worked, of: [l14_1, l14_2], label: "8. Never worked and long-term unemployed", short: Never worked}

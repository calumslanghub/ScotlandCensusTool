# config/explorer.yaml: what the explorer shows and how. Drives the top tabs, the left
# indicator list, the map shading and the right-hand charts. No Census numbers in here:
# every `metric` / `series` id must exist in config/metrics.yaml (units, decimals, source).
#
# Reading order of the UI:
#   categories[]            -> tabs along the top
#   categories[].indicators -> list in the left sidebar
#   indicator.metric        -> the value that shades the map (a metrics.yaml id)
#   indicator.panels[]      -> charts in the right panel, top to bottom
#
# panel.type
#   ranked   one mark per child of the current view (32 council areas, or the localities
#            of the selected LA), sorted low to high. mark: dot | bar. scale: linear | log.
#            `bar` starts at zero. `dot` uses an automatic axis (no zero baseline).
#   profile  bars for the selected feature across `series` (a share-of-total breakdown).
#   composition  one row per category with the selected feature's % as a bar and the
#            averages as ticks. Clicking a row sets the map category (see map.selector).
# panel.reference_lines (the "average lines")
#   national  dashed Scotland line
#   la        dashed line for the selected council area (only drawn once one is selected)
#   Rule: a line is drawn only for a level broader than what the chart shows, so Scotland's
#   own profile has no lines. Use [] for count measures (population) where an average
#   line is meaningless.
#   breakdown  a pie of the children of the selected category (dataset hierarchies, e.g. flat ->
#            its sub-types). Clicking a bar in the composition above it picks the category;
#            `series` lists the parent categories that have children. `group: <name>` shows
#            the children in that dataset category group instead (e.g. age bands).
# map: scheme is a d3-scale-chromatic sequential name (Blues, Greens, Oranges, Purples).
# map.selector: category  adds a "Show" dropdown on the map over the panel's series (or,
#   for dataset-backed indicators, over every mean and category of the dataset).
# panel.title may contain {children} (the view's level) and {metric} (the mapped metric).
#
# An indicator is backed by EITHER
#   metric: <id>                   a single value per area from config/metrics.yaml, or
#   dataset: <id> + headline: <id> a Census table from config/datasets/<id>.yaml. `headline`
#                                  and panel `series` use the dataset's own category / mean
#                                  ids (the build adds the dataset prefix); `<id>__n` is a
#                                  category's count. map.scheme defaults to the dataset's.
# Never both. Datasets whose status is `draft` are hidden from the UI.

version: 1

# Fixed cards at the top of the right panel for the selected feature.
summary_cards: [pop, area_km2, density]

# Left sidebar toggle. `drill` is council area > electoral ward > OA > postcode; `localities`
# is council area > locality > OA > postcode; data zones are a separate national view with
# no drilling.
#
# Each mode is a drill path. The first step is a national layer (the council-area file, or
# a level in levels.yaml export.national_levels). Each later step shows the features of
# `level` whose `link` field equals the code of the area opened at the step before; they
# are filtered in the browser from the open council area's per-LA file. Clicking a council
# area opens it; below that a click selects an area and a second click (or the panel's
# button) opens it. `overlays` lists overlays drawn in that mode.
# `neighbours: true` on a step also shows the features linked to the areas touching the
# open one (levels.yaml assign.neighbours), across council-area boundaries: e.g. the output
# areas of every ward around the open ward. They are full members of the view (shaded,
# selectable, compared, in the baseline and the ranked chart); their council areas' files
# load lazily. They take the open council area's map classes.
map_modes:
  - id: drill
    label: Drill down
    default: true
    path:
      - {level: la}
      - {level: ew, link: parent_code}
      - {level: oa, link: ward_code, neighbours: true}
      - {level: postcode, link: oa_code}
  - id: localities
    label: Localities
    overlays: [outside_localities]
    path:
      - {level: la}
      - {level: locality, link: parent_code}
      - {level: oa, link: locality_code}
      - {level: postcode, link: oa_code}
  - id: dz
    label: Data zones
    path:
      - {level: dz}
  # Dumfries and Galloway only for now. Census values are the sums of the OAs each community
  # council holds the most of (levels.yaml assign.area_fields).
  - id: cc
    label: Community councils
    path:
      - {level: cc}

# Overlays: features of `level` from the open council area's file where `field` is null,
# highlighted while the view shows `at`. `enabled`: on by default (the legend toggles it).
# outside_localities: output areas with no locality (no CLOC2022), kept, never dropped.
overlays:
  outside_localities:
    label: Outside localities
    enabled: true
    level: oa
    at: locality
    field: locality_code

# Basemap: raster tiles under the areas (`tiles`) and, where the areas are see-through,
# labels over them (`label_tiles`). `fill_opacity` (level -> 0..1) lets the basemap show
# through the view's areas at those levels; grey context areas there use `context_opacity`.
# Every other level is opaque and has no labels. The background colour shows if tiles fail.
basemap:
  # Esri Light Gray Canvas (free with attribution; no API key). CARTO's keyless tiles now
  # return "API key required" images: to use Positron, put keyed CARTO URLs here instead.
  attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  tiles:
    - https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}
  label_tiles:
    - https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}
  tile_size: 256
  max_zoom: 16            # the tiles' deepest level; MapLibre enlarges them beyond
  fill_opacity: {oa: 0.7, postcode: 0.7}
  context_opacity: 0.5

# Colours: copy the v4git palette into web/css/tokens.css; do not hard-code them elsewhere.

# compare: up to max_items areas of the same level, charts and table show them side by side.
#   max_items is at most 4 (one chart/map colour each). same_level_only must be true.
# baseline: pick one area; the map shows every other area as above/below it.
#   modes: relative (value / baseline - 1, as %) and/or difference (points for percentages).
#   scheme: diverging (the only one). levels: geography levels (config/levels.yaml) where a
#   baseline can be set; the comparison covers every area the view shows (all of Scotland
#   for data zones; the open ward's and its neighbours' output areas). min_denominator: areas whose `field` (a common-schema count) is
#   below `value` are grey instead of compared.
compare: {max_items: 4, same_level_only: true}
baseline:
  modes: [relative, difference]
  scheme: diverging
  levels: [la, locality, oa, dz, cc]
  min_denominator: {field: pop, value: 50}

# "Find areas" (web/js/query.js): a button in the top bar swaps the left sidebar for a query
# builder. Pick a level, optionally limit it to one council area or ward (`scopes`), add
# criteria from any Census metric (synthetic metrics are left out) and set each one's range,
# as percentiles of the areas in scope or as values. Run shades the map by how many criteria
# each area meets (`scheme` ramp; all of them strongest and outlined).
#   needs_scope   levels whose data is split per council area (output areas): the query must
#                 be limited to a council area or a ward
#   preset_band   High = the top `preset_band` %, Low = the bottom `preset_band` %
# A ward scope keeps the areas with any output area in the ward (levels.yaml census.groups).
query:
  levels: [la, ew, locality, dz, oa, cc]
  scopes: [la, ew]
  needs_scope: [oa]
  preset_band: 25
  max_criteria: 6
  scheme: Purples

# "Cluster areas" (web/js/cluster.js): a second mode of the Find areas builder. The same level,
# scope and Topic -> Metric picker choose the variables; k-means (seeded, in a Web Worker on
# the viewer's device) groups the areas. "Compute elbow" charts the within-cluster sum of
# squares for k = 1..k_max with a suggested k; "Run k-means" colours the map by cluster.
#   enabled          false hides the mode (e.g. a public build); needs the query block
#   min_cores, min_memory_gb   the mode is offered only on devices with at least this many CPU
#                    cores and this much memory (where the browser reports it), on screens wider
#                    than a phone
#   max_work         budget for the elbow sweep (n areas x variables x sum(1..k_max) x restarts
#                    x max_iter); larger jobs must be limited to a smaller scope
#   min_pop          areas with fewer residents are left out (small-number noise)
#   silhouette_sample  areas sampled for the silhouette score (exact is O(n^2))
cluster:
  enabled: true
  k_max: 10
  restarts: 4
  max_iter: 100
  seed: 2022
  min_pop: 50
  silhouette_sample: 2000
  max_work: 2.0e+10
  min_cores: 4
  min_memory_gb: 4

categories:
- id: demographics
  label: Demographics
  indicators:
  - id: age
    label: Average age
    dataset: uv103_age
    headline: mean_age
    map: {selector: category}
    panels:
    - {type: composition, title: "Population by age band (%)", series: [age_0_15, age_16_24, age_25_44, age_45_64, age_65_74, age_75p], reference_lines: [national, la]}
    - {type: ranked, title: "{metric} by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: age_sex
    label: Age by sex
    dataset: uv102b_age_sex
    headline: female
    map: {selector: category}
    panels:
    - {type: composition, title: "Population by sex (%)", series: [female, male], reference_lines: [national, la]}
    - {type: composition, title: "Population by five-year age band (%)", series: [a0_4, a5_9, a10_14, a15, a16_17, a18_19, a20_24, a25_29, a30_34, a35_39, a40_44, a45_49, a50_54, a55_59, a60_64, a65_69, a70_74, a75_79, a80_84, a85p], reference_lines: [national, la]}
    - {type: breakdown, group: sex, title: "Selected age band by sex (% of all people)", series: [a0_4, a5_9, a10_14, a15, a16_17, a18_19, a20_24, a25_29, a30_34, a35_39, a40_44, a45_49, a50_54, a55_59, a60_64, a65_69, a70_74, a75_79, a80_84, a85p], reference_lines: []}
    - {type: ranked, title: "{metric} (%) by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: residence_type
    label: Household or communal residents
    dataset: uv101b_residence_type
    headline: communal
    map: {selector: category}
    panels:
    - {type: composition, title: "Residents by residence type (%)", series: [household, communal], reference_lines: [national, la]}
    - {type: breakdown, group: age, title: "Selected residence type by age (% of all people)", series: [household, communal], reference_lines: []}
    - {type: breakdown, group: sex, title: "Selected residence type by sex (% of all people)", series: [household, communal], reference_lines: []}
    - {type: ranked, title: "{metric} (%) by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: marital
    label: Marital and civil partnership status
    dataset: uv104_marital_status
    headline: married
    map: {selector: category}
    panels:
    - {type: composition, title: "People aged 16+ by status (%)", series: [never_married, married, separated, divorced, widowed], reference_lines: [national, la]}
    - {type: breakdown, group: age, title: "Selected status by age (% of people aged 16+)", series: [never_married, married, separated, divorced, widowed], reference_lines: []}
    - {type: ranked, title: "{metric} (%) by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: living_arrangements
    label: Living arrangements
    dataset: uv106_living_arrangements
    headline: couple
    map: {selector: category}
    panels:
    - {type: composition, title: "People aged 16+ in households by living arrangement (%)", series: [couple, not_couple], reference_lines: [national, la]}
    - {type: breakdown, title: "Within the selected arrangement (% of people aged 16+ in households)", series: [couple, not_couple], reference_lines: []}
    - {type: breakdown, group: age, title: "Selected arrangement by age (% of people aged 16+ in households)", series: [couple, not_couple], reference_lines: []}
    - {type: ranked, title: "{metric} (%) by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: veterans
    label: UK Armed Forces veterans
    dataset: uv901_veterans
    headline: veteran
    map: {selector: category}
    panels:
    - {type: composition, title: "People aged 16+ by veteran status (%)", series: [veteran, not_veteran], reference_lines: [national, la]}
    - {type: ranked, title: "{metric} (%) by {children}", mark: dot, scale: linear, reference_lines: [national, la]}
  - id: population
    label: Total population
    metric: pop
    levels: [la, locality]
    map: {scheme: Blues, classes: 5, method: quantile}
    panels:
    - type: ranked
      title: "Residents by {children}"
      mark: bar
      scale: linear
      reference_lines: []
  - id: density
    label: Population density
    metric: density
    levels: [la, locality]
    map: {scheme: Blues, classes: 5, method: quantile}
    panels:
    - type: ranked
      title: "People per km² by {children}"
      mark: dot
      scale: log
      reference_lines: [national, la]

# kind: stop and add it to build/measures.py with a test.
# Industry x occupation: do NOT try to derive "industries that lead to occupations" from UV605 and
# UV606. Two separate tables give two sets of totals per area, not who works where. That needs a
# cross-tabulation table (industry by occupation). Check whether one is published for the geography
# you want before designing a view.

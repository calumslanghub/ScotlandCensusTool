<title>Census Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: category tabs on top, indicator list left, map centre, graphs right (v4git skeleton, three columns). */
:root {
  --blue: #0065bd; --blue-dark: #00437e; --yellow: #fdd522;
  --ink: #1a1a1a; --slate: #333e48; --muted: #5e5e5e;
  --line: #b3b3b3; --hair: #ebebeb; --paper: #f8f8f8; --panel: #ffffff;
  --red: #d32205; --orange: #e87722; --green: #1a7032; --teal: #28a197; --purple: #741e6d;
  --ctx: #e2e2e2; --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); background: var(--paper); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
button { font-family: var(--font); }

#topnav { min-height: 56px; background: var(--blue); color: #fff; display: flex; align-items: stretch; flex-shrink: 0; user-select: none; }
#logo { padding: 0 22px; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; border-right: 1px solid var(--blue-dark); white-space: nowrap; }
#cats { display: flex; flex: 1; min-width: 0; overflow-x: auto; }
.cat { padding: 0 20px; font-size: .92rem; border: none; border-right: 1px solid var(--blue-dark); background: transparent; color: #fff; cursor: pointer; white-space: nowrap; font-weight: 400; }
.cat:hover { background: var(--blue-dark); }
.cat[aria-selected="true"] { background: var(--yellow); color: var(--ink); font-weight: 700; }
.cat:focus-visible, .geo-btn:focus-visible, .item:focus-visible, .crumb:focus-visible, .tool:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
#navright { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-left: 1px solid var(--blue-dark); }
.badge { font-size: .72rem; color: #dbe9f6; max-width: 190px; line-height: 1.25; }
.tool { font-size: .78rem; padding: 5px 10px; border-radius: 3px; border: 1px solid #7fb0dc; background: transparent; color: #fff; cursor: pointer; white-space: nowrap; }
.tool:hover, .tool[aria-pressed="true"] { background: #fff; color: var(--blue); }

#body { display: flex; flex: 1; min-height: 0; }
#sidebar { width: 248px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }
.sbh { padding: 10px 14px 7px; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--hair); }
.geo { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--hair); background: #fafafa; }
.geo-btn { flex: 1; padding: 5px 6px; font-size: .78rem; cursor: pointer; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--slate); }
.geo-btn:hover { background: var(--hair); border-color: var(--blue); color: var(--blue); }
.geo-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
#sbList { flex: 1; overflow-y: auto; }
.item { display: block; width: 100%; text-align: left; padding: 9px 14px; font-size: .82rem; color: var(--ink); cursor: pointer; border: none; border-bottom: 1px solid var(--hair); background: #fff; line-height: 1.35; }
.item small { display: block; color: var(--muted); font-size: .72rem; margin-top: 1px; }
.item:hover { background: var(--paper); color: var(--blue); }
.item.active { background: var(--hair); color: var(--blue); font-weight: 700; border-left: 3px solid var(--yellow); padding-left: 11px; }
.item.active small { font-weight: 400; }
#sbFoot { padding: 10px 14px; font-size: .72rem; color: var(--muted); border-top: 1px solid var(--hair); line-height: 1.4; }

#mapwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; position: relative; }
#crumbbar { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-bottom: 1px solid var(--hair); background: #fff; min-height: 38px; font-size: .82rem; flex-wrap: wrap; }
#back { padding: 4px 10px; font-size: .78rem; cursor: pointer; background: #fff; border: 1px solid var(--line); border-radius: 3px; color: var(--slate); }
#back:hover { background: var(--hair); }
.crumb { background: none; border: none; padding: 2px 3px; color: var(--blue); cursor: pointer; font-size: .82rem; }
.crumb:hover { text-decoration: underline; }
.crumb.here { color: var(--ink); font-weight: 700; cursor: default; text-decoration: none; }
.sep { color: var(--muted); }
#mapbox { flex: 1; position: relative; min-height: 0; background: #fff; }
#map { width: 100%; height: 100%; display: block; }
#map path { vector-effect: non-scaling-stroke; }
.f { stroke: #fff; stroke-width: .6; cursor: pointer; }
.ctx { fill: var(--ctx); stroke: #fff; stroke-width: .6; cursor: pointer; }
.ctx:hover { fill: #d2d2d2; }
.ov { fill: none; pointer-events: none; }
#legend { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font-size: .74rem; min-width: 150px; }
#legend b { display: block; font-size: .76rem; margin-bottom: 1px; }
#legend .u { color: var(--muted); margin-bottom: 5px; display: block; }
#legend .row { display: flex; align-items: center; gap: 7px; line-height: 1.5; font-variant-numeric: tabular-nums; }
#legend i { width: 16px; height: 10px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
#hint { position: absolute; right: 12px; bottom: 12px; font-size: .72rem; color: var(--muted); background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 3px; border: 1px solid var(--hair); max-width: 46%; text-align: right; }
#notice { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--slate); color: #fff; font-size: .78rem; padding: 7px 12px; border-radius: 3px; max-width: 80%; }
#yaml { position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%; background: #20262c; color: #e8edf2; border-top: 3px solid var(--yellow); display: flex; flex-direction: column; z-index: 5; }
#yaml header { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; font-size: .74rem; color: #aab6c2; border-bottom: 1px solid #38424c; gap: 12px; }
#yaml pre { margin: 0; padding: 10px 14px; overflow: auto; font: 12px/1.5 var(--mono); tab-size: 2; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--slate); color: #fff; font-size: .76rem; padding: 5px 8px; border-radius: 3px; line-height: 1.35; max-width: 220px; }
#tip span { color: #cfd8e0; }

#panel { width: 400px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; flex-shrink: 0; min-height: 0; }
.pin { padding: 14px 18px 24px; }
.ptitle { font-size: 1.15rem; font-weight: 700; margin: 0; }
.psub { font-size: .76rem; color: var(--muted); margin: 2px 0 12px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.card { border: 1px solid var(--hair); background: #fafafa; padding: 8px 10px; border-radius: 3px; min-width: 0; }
.card .k { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card .v { font-size: 1.15rem; font-weight: 700; color: var(--blue-dark); font-variant-numeric: tabular-nums; }
.card .d { font-size: .7rem; color: var(--muted); }
.desc { font-size: .82rem; line-height: 1.5; color: var(--slate); margin: 0 0 14px; }
.pnl { border-top: 1px solid var(--hair); padding-top: 12px; margin-top: 4px; }
.pnl h3 { font-size: .86rem; margin: 0 0 4px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .72rem; color: var(--slate); margin-bottom: 4px; }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg svg { width: 22px; height: 8px; }
.pnl svg.ch { width: 100%; display: block; overflow: visible; }
.ch text { font-family: var(--font); }
.foot { font-size: .7rem; color: var(--muted); margin-top: 14px; line-height: 1.4; }
.dot { cursor: pointer; }

#crumbbar .grow { flex: 1; }
.tool2 { font-size: .78rem; padding: 4px 10px; border-radius: 3px; border: 1px solid var(--line); background: #fff; color: var(--slate); cursor: pointer; white-space: nowrap; }
.tool2:hover { background: var(--hair); border-color: var(--blue); color: var(--blue); }
.tool2[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
.tool2.sm { font-size: .74rem; padding: 3px 8px; margin-top: 6px; }
.tool2:focus-visible, .seg button:focus-visible, #selSel:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.chip.base { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; background: #f1e6f0; color: var(--purple); border: 1px solid #d9bfd6; border-radius: 12px; padding: 2px 4px 2px 10px; }
.chip.base button { border: none; background: none; color: var(--purple); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 5px; }
#selbox { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font-size: .78rem; display: flex; align-items: center; gap: 7px; max-width: calc(100% - 24px); }
#selbox label { font-weight: 700; color: var(--muted); }
#selSel { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); max-width: 230px; }
.seg { display: flex; margin-top: 7px; }
.seg button { flex: 1; font-size: .72rem; padding: 3px 6px; border: 1px solid var(--line); background: #fff; color: var(--slate); cursor: pointer; }
.seg button:first-child { border-radius: 3px 0 0 3px; } .seg button:last-child { border-radius: 0 3px 3px 0; border-left: none; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.basebox { font-size: .78rem; line-height: 1.45; color: var(--slate); background: #f6eff6; border: 1px solid #e3d0e1; border-radius: 3px; padding: 8px 10px; margin: 0 0 12px; }
.basebox b { display: block; color: var(--purple); }
table.cmp { width: 100%; border-collapse: collapse; font-size: .78rem; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
table.cmp th { text-align: right; font-size: .68rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--hair); }
table.cmp td:first-child { white-space: nowrap; }
table.cmp i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid #1a1a1a; }
.crow { cursor: pointer; } .crow:hover rect:first-child { fill: #f3f3f3; }
@media (max-width: 900px) {
  body { overflow: auto; }
  #body { flex-direction: column; flex: none; }
  #sidebar { width: 100%; max-height: 210px; border-right: none; border-bottom: 1px solid var(--line); }
  #mapwrap { height: 62vh; flex: none; }
  #panel { width: 100%; border-left: none; border-top: 1px solid var(--line); overflow: visible; }
  .pin { padding-inline: 16px; }
  #navright .badge { display: none; }
  #logo { padding: 0 14px; }
  #hint { display: none; }
}
</style>

<header id="topnav">
  <div id="logo">Census Explorer</div>
  <nav id="cats" role="tablist" aria-label="Census topics"></nav>
  <div id="navright">
    <span class="badge">Mockup. Only population and density are real.</span>
    <button class="tool" id="yamlBtn" aria-pressed="false">Spec (YAML)</button>
  </div>
</header>

<div id="body">
  <aside id="sidebar" aria-label="Indicators">
    <div class="sbh">Map view</div>
    <div class="geo">
      <button class="geo-btn active" id="gDrill">Drill down</button>
      <button class="geo-btn" id="gDz">Data zones</button>
    </div>
    <div class="sbh" id="sbCat">Indicators</div>
    <div id="sbList"></div>
    <div id="sbFoot">Click a council area to zoom to its localities. Click a locality or a dot in a chart to select it. Click blank map to deselect. Esc steps back.</div>
  </aside>

  <main id="mapwrap">
    <div id="crumbbar"></div>
    <div id="mapbox">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of Scotland"></svg>
      <div id="selbox" hidden></div>
      <div id="legend"></div>
      <div id="hint"></div>
      <div id="notice" hidden></div>
      <section id="yaml" hidden>
        <header><span id="yamlHead"></span><button class="tool" id="yamlClose">Close</button></header>
        <pre id="yamlPre"></pre>
      </section>
    </div>
  </main>

  <aside id="panel" aria-live="polite"></aside>
</div>
<div id="tip" hidden></div>

<script>
const GEO = /*GEO*/null;

/* ---------- The spec. In the build this is config/explorer.yaml; the YAML drawer prints this same object. ---------- */
const SPEC = {
  compare: { max_items: 4, same_level_only: true },
  baseline: { modes: ['relative', 'difference'], scheme: 'diverging', levels: ['la', 'locality', 'oa'] },
  categories: [
    { id: 'population', label: 'Population', indicators: [
      { id: 'median_age', label: 'Median age', metric: 'median_age', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Median age by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'age_structure', label: 'Age structure', metric: 'age_75p', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile' },
        panels: [
          { type: 'profile', title: 'Population by age band (%)', series: ['age_0_15','age_16_24','age_25_44','age_45_64','age_65_74','age_75p'], reference_lines: ['national','la'] },
          { type: 'ranked', title: 'Aged 75 and over (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'population', label: 'Total population', metric: 'pop', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Residents by {children}', mark: 'bar', scale: 'linear', reference_lines: [] }] },
      { id: 'density', label: 'Population density', metric: 'density', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'People per km² by {children}', mark: 'dot', scale: 'log', reference_lines: ['national','la'] }] }
    ]},
    { id: 'households', label: 'Households & housing', indicators: [
      { id: 'tenure', label: 'Tenure', metric: 'ten_social', levels: ['la','locality'],
        map: { scheme: 'Oranges', classes: 5, method: 'quantile' },
        panels: [
          { type: 'profile', title: 'Households by tenure (%)', series: ['ten_own_outright','ten_mortgage','ten_social','ten_private','ten_other'], reference_lines: ['national','la'] },
          { type: 'ranked', title: 'Social rented (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'hh_size', label: 'Average household size', metric: 'hh_size', levels: ['la','locality'],
        map: { scheme: 'Greens', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'People per household by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] }
    ]},
    { id: 'health', label: 'Health', indicators: [
      { id: 'health_good', label: 'Good or very good health', metric: 'health_good', levels: ['la','locality'],
        map: { scheme: 'Greens', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Good or very good health (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'ltc', label: 'Long-term condition', metric: 'ltc', levels: ['la','locality'],
        map: { scheme: 'Purples', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'One or more long-term conditions (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] }
    ]},
    { id: 'education', label: 'Education', indicators: [
      { id: 'no_quals', label: 'No qualifications', metric: 'no_quals', levels: ['la','locality'],
        map: { scheme: 'Oranges', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'No qualifications (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'degree', label: 'Degree level or above', metric: 'degree', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Degree level or above (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] }
    ]},
    { id: 'labour', label: 'Labour market', indicators: [
      { id: 'econ_active', label: 'Economic activity rate', metric: 'econ_active', levels: ['la','locality'],
        map: { scheme: 'Greens', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Economically active, aged 16+ (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'industry', label: 'Industry of employment', metric: 'ind_health', levels: ['la','locality'],
        map: { scheme: 'Blues', classes: 5, method: 'quantile', selector: 'category' },
        panels: [{ type: 'composition', title: 'Employed people by industry (%)', series: ['ind_health','ind_retail','ind_education','ind_public','ind_construction','ind_other'], reference_lines: ['national','la'] }] }
    ]},
    { id: 'transport', label: 'Travel', indicators: [
      { id: 'travel_work', label: 'Travel to work', metric: 'tw_cycle', levels: ['la','locality'],
        map: { scheme: 'Greens', classes: 5, method: 'quantile' },
        panels: [
          { type: 'profile', title: 'Usual way of travelling to work (%)', series: ['tw_car','tw_pt','tw_walk','tw_cycle','tw_home'], reference_lines: ['national','la'] },
          { type: 'ranked', title: 'Cycle to work (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] },
      { id: 'no_car', label: 'No car or van', metric: 'no_car', levels: ['la','locality'],
        map: { scheme: 'Oranges', classes: 5, method: 'quantile' },
        panels: [{ type: 'ranked', title: 'Households with no car or van (%) by {children}', mark: 'dot', scale: 'linear', reference_lines: ['national','la'] }] }
    ]}
  ]
};

/* ---------- Metric definitions (in the build: config/metrics.yaml). base/urban/spread only exist to fake plausible values. ---------- */
const M = {
  pop:        { label: 'Population', unit: 'people', dec: 0, real: true },
  density:    { label: 'Population density', unit: 'people per km²', dec: 0, real: true },
  median_age: { label: 'Median age', unit: 'years', dec: 1, base: 42.5, urban: -3.4, spread: 1.5 },
  age_0_15:   { label: 'Aged 0–15', short: '0–15', unit: '%', dec: 1, base: 16.4, urban: 0.6, spread: 0.7, share: 1 },
  age_16_24:  { label: 'Aged 16–24', short: '16–24', unit: '%', dec: 1, base: 9.4, urban: 2.4, spread: 0.7, share: 1 },
  age_25_44:  { label: 'Aged 25–44', short: '25–44', unit: '%', dec: 1, base: 25.2, urban: 4.0, spread: 1.0, share: 1 },
  age_45_64:  { label: 'Aged 45–64', short: '45–64', unit: '%', dec: 1, base: 27.4, urban: -3.0, spread: 0.9, share: 1 },
  age_65_74:  { label: 'Aged 65–74', short: '65–74', unit: '%', dec: 1, base: 11.9, urban: -2.6, spread: 0.8, share: 1 },
  age_75p:    { label: 'Aged 75 and over', short: '75+', unit: '%', dec: 1, base: 9.7, urban: -2.0, spread: 0.8, share: 1 },
  hh_size:    { label: 'Average household size', unit: 'people', dec: 2, base: 2.2, urban: -0.15, spread: 0.07 },
  ten_own_outright: { label: 'Owned outright', short: 'Owned', unit: '%', dec: 1, base: 31, urban: -9, spread: 3, share: 1 },
  ten_mortgage:     { label: 'Owned with mortgage', short: 'Mortgage', unit: '%', dec: 1, base: 29, urban: -4, spread: 3, share: 1 },
  ten_social:       { label: 'Social rented', short: 'Social', unit: '%', dec: 1, base: 22, urban: 7, spread: 3, share: 1 },
  ten_private:      { label: 'Private rented', short: 'Private', unit: '%', dec: 1, base: 14, urban: 7, spread: 2.5, share: 1 },
  ten_other:        { label: 'Other', short: 'Other', unit: '%', dec: 1, base: 4, urban: 0, spread: 1.2, share: 1 },
  health_good: { label: 'Good or very good health', unit: '%', dec: 1, base: 81.5, urban: -2.5, spread: 1.2 },
  ltc:         { label: 'Long-term condition', unit: '%', dec: 1, base: 33, urban: -1.5, spread: 1.8 },
  no_quals:    { label: 'No qualifications', unit: '%', dec: 1, base: 16, urban: 1.5, spread: 2.2 },
  degree:      { label: 'Degree level or above', unit: '%', dec: 1, base: 33, urban: 7, spread: 3 },
  econ_active: { label: 'Economic activity rate', unit: '%', dec: 1, base: 60.5, urban: 3, spread: 2 },
  ind_health:       { label: 'Health and social work', short: 'Health', unit: '%', dec: 1, base: 17, urban: -0.5, spread: 2, share: 1 },
  ind_retail:       { label: 'Retail and wholesale', short: 'Retail', unit: '%', dec: 1, base: 13.5, urban: -0.5, spread: 1.2, share: 1 },
  ind_education:    { label: 'Education', short: 'Educ.', unit: '%', dec: 1, base: 8, urban: 0.5, spread: 1, share: 1 },
  ind_public:       { label: 'Public administration', short: 'Public', unit: '%', dec: 1, base: 7, urban: 1, spread: 1.3, share: 1 },
  ind_construction: { label: 'Construction', short: 'Constr.', unit: '%', dec: 1, base: 8, urban: -2, spread: 1.2, share: 1 },
  ind_other:        { label: 'All other industries', short: 'Other', unit: '%', dec: 1, base: 46.5, urban: 1.5, spread: 3, share: 1 },
  tw_car:   { label: 'Car or van', short: 'Car/van', unit: '%', dec: 1, base: 56, urban: -15, spread: 4, share: 1 },
  tw_pt:    { label: 'Public transport', short: 'Public', unit: '%', dec: 1, base: 10, urban: 7, spread: 2, share: 1 },
  tw_walk:  { label: 'On foot', short: 'Walk', unit: '%', dec: 1, base: 11, urban: 4, spread: 2.5, share: 1 },

    s += p.mark === 'bar'
      ? `<rect class="dot" data-c="${k.f.c}" x="${X(i) - bw / 2}" y="${Y(k.v)}" width="${bw}" height="${Math.max(0.5, Y(lo) - Y(k.v))}" fill="${COL.dot}"/>`
      : `<circle class="dot" data-c="${k.f.c}" cx="${X(i)}" cy="${Y(k.v)}" r="${r}" fill="${COL.dot}" fill-opacity=".8"/>`;
  });
  for (const [v, c] of [[natV, COL.nat], [laV, COL.la], [baseV, COL.base]]) if (v != null) s += `<line x1="${L.l}" x2="${W - L.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  s += top;
  s += `<text x="${L.l}" y="${H - 8}" font-size="10" fill="#5e5e5e">${lvl === 'la' ? '32 council areas' : n + ' localities'}, ranked low to high</text></svg>`;
  return legendHTML({ mark: lvl === 'la' ? 'Council area' : 'Locality', members: memberLeg(fl),
    nat: rl.nat ? 'Scotland ' + fmt(natV, d.dec) : null, la: rl.la ? LAS[S.la].n + ' ' + fmt(laV, d.dec) : null,
    base: baseV != null ? 'Baseline ' + fmt(baseV, d.dec) : null }) + s;
}

/* Subjects of a breakdown chart: the focus features, or Scotland when nothing is selected. */
function subjects() {
  const fl = focusList();
  return fl.length ? fl : [{ f: null, col: COL.dot, single: true, name: 'Scotland' }];
}
const subjName = (x) => x.f ? x.f.n : x.name;
const subjVal = (id, x) => x.f ? val(id, x.f) : national(id);
function lineFlags(p, fl) {
  const rl = p.reference_lines || [], feats = fl.filter(x => x.f);
  return { nat: rl.includes('national') && feats.length > 0, la: rl.includes('la') && !!S.la && feats.length > 0 && feats.every(x => LOCS[x.f.c]) };
}

function profileChart(p) {
  const W = panelW(), H = 230, L = { l: 40, r: 10, t: 16, b: 30 }, pw = W - L.l - L.r, ph = H - L.t - L.b;
  const subs = subjects(), nS = subs.length, fl = lineFlags(p, subs);
  const rows = p.series.map(id => ({ id, v: subs.map(x => subjVal(id, x)), nat: national(id), la: S.la ? val(id, LAS[S.la]) : null }));
  const mx = Math.max(...rows.flatMap(r => [...r.v, fl.nat ? r.nat : 0, fl.la ? r.la : 0]));
  const ticks = niceTicks(0, mx * 1.12), top = ticks[ticks.length - 1], Y = (v) => L.t + ph * (1 - v / top), n = rows.length, bw = pw / n;
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.title)}">`;
  for (const t of ticks) s += `<line x1="${L.l}" x2="${W - L.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t ? '#ebebeb' : '#b3b3b3'}"/><text x="${L.l - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10" fill="#5e5e5e">${fmt(t)}</text>`;
  rows.forEach((r, i) => {
    const gw = bw * 0.72, w = gw / nS, x0 = L.l + bw * i + (bw - gw) / 2;
    r.v.forEach((v, j) => {
      s += `<rect x="${x0 + w * j}" y="${Y(v)}" width="${w - (nS > 1 ? 1 : 0)}" height="${Y(0) - Y(v)}" fill="${subs[j].col}"/>`;
      if (nS === 1) s += `<text x="${x0 + w / 2}" y="${Y(0) - 6}" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="500">${fmt(v, 1)}</text>`;
    });
    s += `<text x="${L.l + bw * i + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="10" fill="#333e48">${esc(M[r.id].short)}</text>`;
  });
  const line = (key, col) => {
    const pts = rows.map((r, i) => `${L.l + bw * i + bw / 2},${Y(r[key])}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-dasharray="6 4"/>` +
      rows.map((r, i) => `<circle cx="${L.l + bw * i + bw / 2}" cy="${Y(r[key])}" r="3" fill="#fff" stroke="${col}" stroke-width="1.8"/>`).join('');
  };
  if (fl.nat) s += line('nat', COL.nat);
  if (fl.la) s += line('la', COL.la);
  s += '</svg>';
  const cmp = S.cmpOn && subs.length > 1 || (S.cmpOn && subs.length === 1 && subs[0].f);
  return legendHTML({ mark: cmp ? null : subjName(subs[0]), members: cmp ? subs.map(x => ({ name: subjName(x), col: x.col })) : [], nat: fl.nat ? 'Scotland' : null, la: fl.la ? LAS[S.la].n : null }) + s;
}

/* Composition: one row per category, bars for each subject, ticks for the averages. Rows set the map category. */
function compositionChart(p, ind) {
  const W = panelW(), subs = subjects(), nS = subs.length, fl = lineFlags(p, subs), LBL = 132, R = 40, pw = W - LBL - R;
  const rows = p.series.map(id => ({ id, v: subs.map(x => subjVal(id, x)), nat: national(id), la: S.la ? val(id, LAS[S.la]) : null }));
  rows.sort((a, b) => b.v[0] - a.v[0]);
  const mx = Math.max(...rows.flatMap(r => [...r.v, fl.nat ? r.nat : 0, fl.la ? r.la : 0])) * 1.08;
  const bh = nS > 2 ? 6 : nS > 1 ? 8 : 12, rowH = nS * bh + 12, H = rows.length * rowH + 22, X = (v) => LBL + pw * v / mx;
  const cur = curMetric();
  let s = `<svg class="ch comp" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.title)}">`;
  rows.forEach((r, i) => {
    const y = 6 + i * rowH, on = r.id === cur;
    s += `<g class="crow" data-sel="${r.id}" tabindex="0" role="button" aria-pressed="${on}"><rect x="0" y="${y - 3}" width="${W}" height="${rowH}" fill="${on ? '#ebebeb' : 'transparent'}"/>`;
    if (on) s += `<rect x="0" y="${y - 3}" width="3" height="${rowH}" fill="#fdd522"/>`;
    s += `<text x="8" y="${y + rowH / 2 + 1}" font-size="11" fill="${on ? '#0065bd' : '#1a1a1a'}" font-weight="${on ? 700 : 400}">${esc(M[r.id].label.length > 22 ? M[r.id].label.slice(0, 21) + '…' : M[r.id].label)}</text>`;
    r.v.forEach((v, j) => {
      s += `<rect x="${LBL}" y="${y + j * bh}" width="${Math.max(1, X(v) - LBL)}" height="${bh - 1.5}" fill="${subs[j].col}"/>`;
      if (j === 0) s += `<text x="${X(v) + 4}" y="${y + bh - 2}" font-size="10" fill="#333e48">${fmt(v, 1)}</text>`;
    });
    const tick = (v, c) => `<line x1="${X(v)}" x2="${X(v)}" y1="${y - 2}" y2="${y + nS * bh + 1}" stroke="${c}" stroke-width="2" stroke-dasharray="3 2"/>`;
    if (fl.nat) s += tick(r.nat, COL.nat);
    if (fl.la) s += tick(r.la, COL.la);
    s += '</g>';
  });
  s += `<line x1="${LBL}" x2="${LBL}" y1="0" y2="${H - 18}" stroke="#b3b3b3"/><text x="${LBL}" y="${H - 5}" font-size="10" fill="#5e5e5e">% of employed people. Click a row to map it.</text></svg>`;
  const cmp = S.cmpOn && subs[0].f;
  return legendHTML({ mark: cmp ? null : subjName(subs[0]), members: cmp ? subs.map(x => ({ name: subjName(x), col: x.col })) : [], nat: fl.nat ? 'Scotland' : null, la: fl.la ? LAS[S.la].n : null }) + s;
}

/* ---------- Right panel ---------- */
function deltaText(diff, d) { const sign = diff > 0 ? '+' : diff < 0 ? '−' : ''; return `${sign}${fmt(Math.abs(diff), d.dec)}${d.unit === '%' ? ' pts' : ''} vs Scotland`; }
function baseCandidate() {
  if (S.cmpOn) return S.cmp.length === 1 ? S.cmp[0] : null;
  return S.loc || null;
}
function renderPanel() {
  const ind = IND(), m = curMetric(), d = M[m], fl = focusList(), single = fl.length === 1 && fl[0].single ? fl[0].f : null;
  const totalPop = LA.reduce((s, f) => s + f.pop, 0), totalArea = LA.reduce((s, f) => s + f.a, 0);
  const isCount = m === 'pop' || m === 'density';
  let head, cards, desc;
  if (S.cmpOn) {
    head = `<h2 class="ptitle">Comparing ${fl.length ? fl.length + ' ' + levelWord(fl.length !== 1) : levelWord(true)}</h2><p class="psub">${S.la ? 'Localities in ' + esc(LAS[S.la].n) : 'Council areas'} · up to ${SPEC.compare.max_items}</p>`;
    cards = fl.length ? `<table class="cmp"><thead><tr><th></th><th>Residents</th><th>${esc(d.label)}</th><th>vs Scotland</th></tr></thead><tbody>${fl.map(x => {
      const v = valueFor(m, x.f); return `<tr><td><i style="background:${x.col}"></i>${esc(x.f.n)}</td><td>${fmt(x.f.pop)}</td><td>${fmt(v, d.dec)}${d.unit === '%' ? '%' : ''}</td><td>${isCount ? '–' : deltaText(v - national(m), d).replace(' vs Scotland', '')}</td></tr>`; }).join('')}</tbody></table>` : '';
    desc = fl.length ? 'Marks and bars take the colour of each area. Click an area on the map or a dot in a chart to add or remove it.' : 'Click areas on the map to compare them. The area you had selected is added automatically.';
  } else {
    const focus = single, pop = focus ? focus.pop : totalPop, area = focus ? focus.a : totalArea;
    const title = focus ? focus.n : 'Scotland';
    const sub = S.loc ? `Locality · ${LAS[S.la].n} · ${S.loc}` : S.la ? `Council area · ${S.la}` : 'National view · 32 council areas';
    if (S.loc) desc = `${focus.n} is a census locality assigned to ${LAS[S.la].n}, home to ${fmt(focus.pop)} residents (${fmt(focus.pop / LAS[S.la].pop * 100, 1)}% of the council area) across ${fmt(focus.a, 1)} km².`;
    else if (S.la) desc = `${focus.n} has ${fmt(focus.pop)} residents (${fmt(focus.pop / totalPop * 100, 1)}% of Scotland) across ${fmt(focus.a)} km², an average of ${fmt(dens(focus))} people per km². ${GEO.loc[S.la].length} census localities are assigned to it.`;
    else desc = `${fmt(totalPop)} residents across 32 council areas. Click a council area on the map, or a dot in a chart, to see its localities.`;
    const c4 = isCount
      ? { k: S.la && !S.loc ? 'Localities' : S.loc ? 'Share of area' : 'Council areas', v: S.la && !S.loc ? GEO.loc[S.la].length : S.loc ? fmt(focus.pop / LAS[S.la].pop * 100, 1) + '%' : 32, d: '' }
      : { k: d.label, v: fmt(focus ? valueFor(m, focus) : national(m), d.dec) + (d.unit === '%' ? '%' : ''), d: focus ? deltaText(valueFor(m, focus) - national(m), d) : d.unit };
    head = `<h2 class="ptitle">${esc(title)}</h2><p class="psub">${esc(sub)}</p>`;
    cards = `<div class="cards">
      <div class="card"><div class="k">Residents</div><div class="v">${fmt(pop)}</div></div>
      <div class="card"><div class="k">Area</div><div class="v">${fmt(area, area < 100 ? 1 : 0)} <small style="font-size:.7rem;font-weight:400">km²</small></div></div>
      <div class="card"><div class="k">Density</div><div class="v">${fmt(pop / Math.max(area, .05))}</div><div class="d">people per km²</div></div>
      <div class="card"><div class="k">${esc(c4.k)}</div><div class="v">${c4.v}</div><div class="d">${esc(c4.d || '')}</div></div></div>`;
  }
  const cand = baseCandidate();
  const baseBox = S.base
    ? `<div class="basebox"><b>Baseline: ${esc(FEAT(S.base).n)}</b> The map shows every other ${levelWord(false)} as above or below it. <button class="tool2 sm" id="clearBase2">Clear baseline</button></div>`
    : cand ? `<div class="basebox"><button class="tool2 sm" id="setBase" data-c="${cand}">Use ${esc(FEAT(cand).n)} as baseline</button> Colour the map by how far every other ${levelWord(false)} is above or below it.</div>` : '';
  const panels = ind.panels.map(p => {
    const t = esc(p.title.replace('{children}', levelWord(false)));
    const body = p.type === 'ranked' ? rankedChart(p, ind) : p.type === 'composition' ? compositionChart(p, ind) : profileChart(p);
    return `<section class="pnl"><h3>${t}</h3>${body}</section>`;
  }).join('');
  $('#panel').innerHTML = `<div class="pin">${head}${cards}<p class="desc">${esc(desc)}</p>${baseBox}${panels}
    <p class="foot">Reference lines follow the spec: they show only levels broader than the selection, and are left off count measures. Residents, area and density are real; every other value is invented to show the layout.</p></div>`;
}

/* ---------- YAML view (prints the object the page is drawn from) ---------- */
function yamlScalar(v) { if (typeof v !== 'string') return String(v); return /^[\w.\-/ ]+$/.test(v) && !/^\s|\s$/.test(v) ? v : JSON.stringify(v); }
function toYaml(v, ind = 0) {
  const pad = ' '.repeat(ind);
  if (Array.isArray(v)) {
    if (v.every(x => typeof x !== 'object')) return '[' + v.map(yamlScalar).join(', ') + ']';
    return v.map(x => pad + '- ' + toYaml(x, ind + 2).replace(/^\s+/, '')).join('\n');
  }
  if (v && typeof v === 'object') {
    const inline = (x) => typeof x !== 'object' || (Array.isArray(x) && x.every(y => typeof y !== 'object'));
    return Object.entries(v).map(([k, x], i) => {
      const lead = (i === 0 ? '' : pad);
      if (inline(x)) return `${lead}${k}: ${toYaml(x, ind + 2)}`;
      if (Array.isArray(x)) return `${lead}${k}:\n${toYaml(x, ind + 2)}`;
      return `${lead}${k}:\n${toYaml(x, ind + 2).split('\n').map((l, j) => (j === 0 ? ' '.repeat(ind + 2) + l.replace(/^\s+/, '') : l)).join('\n')}`;
    }).join('\n');
  }
  return yamlScalar(v);
}
function renderYaml() {
  const c = SPEC.categories[S.cat], ind = IND(), ids = ind.panels.flatMap(p => p.series || []);
  const metrics = [...new Set([ind.metric, ...ids])];
  $('#yamlHead').textContent = 'config/explorer.yaml (excerpt). Metric ids refer to config/metrics.yaml: ' + metrics.join(', ');
  $('#yamlPre').textContent = toYaml({ compare: SPEC.compare, baseline: SPEC.baseline }) + '\n\n' + toYaml({ categories: [{ id: c.id, label: c.label, indicators: [ind] }] });
}

/* ---------- Wiring ---------- */
function renderAll(mapToo) { renderNav(); renderSidebar(); renderCrumbs(); if (mapToo !== false) paintMap(); renderPanel(); if (!$('#yaml').hidden) renderYaml(); }
document.addEventListener('click', (e) => {
  const cat = e.target.closest('[data-cat]'); if (cat) { S.cat = +cat.dataset.cat; S.ind = 0; S.base = null; renderAll(); return; }
  const it = e.target.closest('[data-ind]'); if (it) { S.ind = +it.dataset.ind; S.base = null; renderAll(); return; }
  if (e.target.closest('#cmpBtn')) { S.cmpOn = !S.cmpOn; S.cmp = S.cmpOn && S.loc ? [S.loc] : []; renderAll(); return; }
  if (e.target.closest('#clearBase') || e.target.closest('#clearBase2')) { S.base = null; renderAll(); return; }
  const sb = e.target.closest('#setBase'); if (sb) { S.base = sb.dataset.c; renderAll(); return; }
  const df = e.target.closest('[data-diff]'); if (df) { S.diff = df.dataset.diff; renderAll(); return; }
  const row = e.target.closest('[data-sel]'); if (row) { S.sel[IND().id] = row.dataset.sel; renderAll(); return; }
  const dot = e.target.closest('#panel [data-c]'); if (dot) selectFeature(dot.dataset.c);
});
document.addEventListener('change', (e) => { if (e.target.id === 'selSel') { S.sel[IND().id] = e.target.value; renderAll(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.cmpOn && S.cmp.length) clearSelection(); else if (S.base) { S.base = null; renderAll(); } else back(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-sel]')) { S.sel[IND().id] = e.target.closest('[data-sel]').dataset.sel; renderAll(); }
});
$('#panel').addEventListener('mousemove', (e) => { const t = e.target.closest('[data-c]'); t ? showTip(e, t.dataset.c) : hideTip(); });
$('#panel').addEventListener('mouseleave', hideTip);
$('#yamlBtn').onclick = () => { const h = $('#yaml'); h.hidden = !h.hidden; $('#yamlBtn').setAttribute('aria-pressed', String(!h.hidden)); if (!h.hidden) renderYaml(); };
$('#yamlClose').onclick = () => { $('#yaml').hidden = true; $('#yamlBtn').setAttribute('aria-pressed', 'false'); };
$('#gDz').onclick = () => notice('Data zones are a separate map mode in the build and are not drawn in this mockup.');
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(renderPanel, 80); }).observe($('#panel'));
renderAll();
</script>
